name: Render Product Video

# Yalnızca compose_product_video MCP aracı (src/video-compose.js) tarafından
# workflow_dispatch API'si üzerinden tetiklenir — push/PR ile OTOMATİK
# çalışmaz. Vercel serverless'ın süre/bellek sınırları FFmpeg render'ı için
# riskli olduğundan (klasik/Fluid olmayan Pro planında 15sn sınırı var),
# ağır render işi burada, GitHub Actions'ın ücretsiz dakika kotasında
# çalıştırılır. İş durumu GitHub'ın kendisinden değil, Vercel Blob'daki
# video-jobs/<jobId>.json dosyasından okunur (bkz. src/lib/video-jobs.js) —
# workflow_dispatch 204 No Content döner ve bir run ID vermez.
on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "video-jobs/<jobId>.json içindeki işin ID'si"
        required: true
        type: string

# En düşük yetki: bu iş depoya hiçbir şey yazmaz, yalnızca checkout yapıp
# ffmpeg çalıştırır ve secrets.BLOB_READ_WRITE_TOKEN ile Vercel Blob'a
# (GitHub dışı bir servise) yükler — varsayılan (genelde daha geniş olan)
# GITHUB_TOKEN izinlerine hiç ihtiyaç yok.
permissions:
  contents: read

# Aynı jobId için art arda/yanlışlıkla tekrar tetiklenen bir dispatch,
# önceki render'ı boşuna sürdürmesin diye iptal edilir — farklı jobId'ler
# birbirini ETKİLEMEZ, paralel çalışmaya devam eder.
concurrency:
  group: render-product-video-${{ inputs.jobId }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    # workflow_dispatch API'sini GitHub UI/API üzerinden manuel tetikleyen biri
    # farklı bir dal/tag seçebilir — src/video-compose.js'in kendi dispatch
    # çağrısı her zaman VIDEO_RENDER_REF'i (varsayılan "main") gönderse de, bu
    # ekstra bir savunma katmanı: iş yalnızca main referansıyla tetiklenmişse
    # ilerler.
    if: github.ref == 'refs/heads/main'
    # Gerçek ffmpeg render'ının kendisi hızlı (bkz. scripts/smoke-test-render.mjs
    # ölçümü — 3 görsel + kapanış ~5-10sn), ancak 10 görsel + müzik indirme +
    # apt-get/npm kurulumu birlikte birkaç dakikaya çıkabilir; takılı kalan bir
    # işi süresiz beklemek yerine erken sonlandırıyoruz.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # GEÇİCİ TEŞHİS: iki gerçek render arka arkaya "No space left on device"
      # ile düştü. RUNNER_TEMP'e geçmek yardımcı olmayabilir (ubuntu-latest'te
      # /tmp ve RUNNER_TEMP aynı kök dosya sistemi olabilir) — bu adım gerçek
      # disk durumunu (ve hangi bölümün gerçekten dolduğunu) görmek için;
      # kök nedeni doğruladıktan sonra kaldırılacak.
      - name: Disk durumu (teşhis)
        run: |
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          df -h
          echo "--- /tmp'in bulunduğu aygıt ---"
          stat -f /tmp
          echo "--- RUNNER_TEMP'in bulunduğu aygıt ---"
          stat -f "$RUNNER_TEMP"
          echo "--- En büyük dizinler (/usr, /opt) ---"
          du -sh /usr/* /opt/* 2>/dev/null | sort -rh | head -20 || true
      - name: Render video
        env:
          JOB_ID: ${{ inputs.jobId }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: node scripts/render-product-video.mjs
      # GEÇİCİ TEŞHİS (yukarıdaki adımla eşleşir): render başarısız da olsa
      # (if: always()) render SONRASI disk durumunu yakalar — başlangıçtaki
      # ölçümle karşılaştırıp "disk zaten mi doluydu, yoksa bizim iş mi
      # doldurdu" sorusunu kesin olarak cevaplamak için.
      - name: Disk durumu (render sonrası, teşhis)
        if: always()
        run: df -h
