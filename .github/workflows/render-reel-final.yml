name: Render Reel Final

# Yalnızca compose_reel_final MCP aracı (src/reel-final-assembly.js)
# tarafından workflow_dispatch API'si üzerinden tetiklenir — push/PR ile
# OTOMATİK çalışmaz. bkz. render-reel-audio.yml (aynı gerekçe: Vercel
# serverless'ın süre/bellek sınırları FFmpeg için riskli).
on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "video-jobs/<jobId>.json içindeki işin ID'si"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: render-reel-final-${{ inputs.jobId }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Birden fazla sahne videosunun indirilmesi + concat + ses mix'i
    # render-reel-audio'dan daha uzun sürebilir.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render reel final
        env:
          JOB_ID: ${{ inputs.jobId }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/render-reel-final.mjs
