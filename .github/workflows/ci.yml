name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      # Gizli değer gerektirmez: process.env'i sadece okur, eksik/varsayılan
      # durumunu loglar; hiçbir gerçek değeri ekrana yazmaz.
      - run: npm run check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gitleaks'in ücretli GitHub Action sarmalayıcısı yerine doğrudan MIT
      # lisanslı CLI ikilisini indirip çalıştırıyoruz — özel repo/organizasyon
      # lisans şartına takılmadan aynı taramayı yapar. .gitleaksignore, bilinen
      # yanlış pozitifleri (Airtable base/tablo ID'leri, ga4.test.js'teki
      # sahte PEM anahtarları) allowlist'e alır.
      #
      # Sürüm bilinçli olarak sabitlendi ("latest" değil): .gitleaksignore
      # içindeki fingerprint'ler bu sürümün ruleset'ine göre doğrulandı; daha
      # yeni bir sürüm farklı/ek kurallarla yanlış pozitif sayısını
      # öngörülemez şekilde artırabilir (bu PR'da tam olarak bu yaşandı — bkz.
      # PR #1 tartışması). Periyodik olarak elle yükseltip yeniden doğrulayın.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Run gitleaks
        run: ./gitleaks detect --source . --no-banner --redact
