name: Render Reel Audio

# Yalnızca compose_reel_audio MCP aracı (src/reel-audio-compose.js)
# tarafından workflow_dispatch API'si üzerinden tetiklenir — push/PR ile
# OTOMATİK çalışmaz. bkz. render-product-video.yml (aynı gerekçe: Vercel
# serverless'ın süre/bellek sınırları FFmpeg için riskli).
on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "video-jobs/<jobId>.json içindeki işin ID'si"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: render-reel-audio-${{ inputs.jobId }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Ses mix'i (video re-encode YOK, -c:v copy) render-product-video'daki
    # slayt render'ından çok daha hızlı olmalı — yine de video indirme +
    # apt-get/npm kurulumu birlikte birkaç dakikayı bulabilir.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render reel audio
        env:
          JOB_ID: ${{ inputs.jobId }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/render-reel-audio.mjs
